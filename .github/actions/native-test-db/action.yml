name: Native test database
description: Provision isolated native PostgreSQL/PostGIS and private file storage without containers
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
        sudo service postgresql start
        sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER supplybiz_ci WITH PASSWORD 'synthetic_ci_only';"
        sudo -u postgres createdb -O supplybiz_ci supplybiz_test
        sudo -u postgres psql -v ON_ERROR_STOP=1 -d supplybiz_test -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
        echo 'DATABASE_URL=postgresql://supplybiz_ci:synthetic_ci_only@127.0.0.1:5432/supplybiz_test' >> "$GITHUB_ENV"
        echo 'ABUSE_TEST_DATABASE_URL=postgresql://supplybiz_ci:synthetic_ci_only@127.0.0.1:5432/supplybiz_test' >> "$GITHUB_ENV"
        echo 'NATIVE_TEST_DATABASE_URL=postgresql://supplybiz_ci:synthetic_ci_only@127.0.0.1:5432/supplybiz_test' >> "$GITHUB_ENV"
        echo "UPLOAD_ROOT=$HOME/.local/share/supplybiz-ci/uploads" >> "$GITHUB_ENV"
    - shell: bash
      run: |
        pnpm --filter @supplybiz/api prisma:generate
        pnpm --filter @supplybiz/api prisma:migrate:deploy
