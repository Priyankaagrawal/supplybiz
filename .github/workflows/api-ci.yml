name: api-ci
on:
  pull_request:
    paths: ['apps/api/**', 'contracts/**', 'tools/check-*.mjs', 'tools/module-prerequisites.mjs', 'tools/checks.spec.mjs', 'tools/normalize-generated-docs.mjs', 'tools/codegen.sh', 'tools/openapi/**', 'pnpm-lock.yaml', '.github/workflows/api-ci.yml', '.github/actions/native-test-db/**']
  workflow_dispatch:
    inputs:
      task:
        description: Task ID with focused checks
        required: true
        default: T-182
jobs:
  task:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      CHECK_LAYER: api
      TASK_ID: ${{ inputs.task }}
      TASK_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/native-test-db
      - run: node tools/check-task.mjs
      - name: Detect contract changes
        id: contract
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "${BASE_REF:-HEAD~1}" HEAD -- contracts apps/api/scripts/generate-openapi.ts apps/api/src | rg '(contracts/|generate-openapi|controller|dto)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.contract.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        if: steps.contract.outputs.changed == 'true'
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Contract generation and drift (only when affected)
        if: steps.contract.outputs.changed == 'true'
        run: |
          tools/codegen.sh
          if [ -n "$(git status --porcelain -- contracts packages/api_client packages/ts-client)" ]; then
            echo 'Generated contract/client drift detected; regenerate and commit all generated outputs.'
            git status --short -- contracts packages/api_client packages/ts-client
            exit 1
          fi
