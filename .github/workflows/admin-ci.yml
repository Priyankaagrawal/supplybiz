name: admin-ci
on:
  pull_request:
    paths: ['apps/admin/**', 'packages/ts-client/**', 'pnpm-lock.yaml', '.github/workflows/admin-ci.yml']
  workflow_dispatch:
jobs:
  admin:
    name: Admin lint, typecheck, focused security and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Detect real admin checks
        id: availability
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('apps/admin/package.json', 'utf8'));
          const ready = ['lint', 'typecheck', 'test', 'build'].every(key => pkg.scripts[key] && !/echo|TODO|No .* yet/.test(pkg.scripts[key]));
          appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          if (!ready) console.log('::notice::NOT_RUN: admin lint/build/tests remain unimplemented until T-150. Placeholder commands are not checks.');
          JS
      - if: steps.availability.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @supplybiz/admin lint
          pnpm --filter @supplybiz/admin typecheck
          pnpm --filter @supplybiz/admin test
          pnpm --filter @supplybiz/admin build
