name: mobile-ci
on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/ui_kit/**', 'packages/api_client/**', 'pubspec*', 'melos.yaml', '.fvmrc', 'tools/check-task.mjs', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:
    inputs:
      task:
        description: Mobile task ID with focused checks
        required: true
        default: T-183
jobs:
  task:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHECK_LAYER: mobile
      TASK_ID: ${{ inputs.task }}
      TASK_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - run: dart format --output=none --set-exit-if-changed apps/mobile/lib apps/mobile/test apps/mobile/integration_test packages/ui_kit/lib packages/ui_kit/test
      - run: node tools/check-task.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/native-test-db
      - run: pnpm --filter @supplybiz/api build
      - name: Android baseline screen/API smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            node apps/api/dist/main.js > "$RUNNER_TEMP/supplybiz-api.log" 2>&1 &
            api_pid=$!
            trap 'kill "$api_pid"' EXIT
            for attempt in {1..30}; do
              if curl --fail --silent http://localhost:3000/api/v1/health/ready; then break; fi
              sleep 1
            done
            curl --fail --silent http://localhost:3000/api/v1/health/ready
            cd apps/mobile
            flutter test integration_test/baseline_test.dart -d emulator-5554 --flavor dev --dart-define-from-file=config/dev.json --no-pub
