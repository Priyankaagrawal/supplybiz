name: supplybiz-local

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: supplybiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supplybiz
      POSTGRES_USER: supplybiz
      POSTGRES_PASSWORD: supplybiz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplybiz -d supplybiz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: supplybiz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: supplybiz-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: supplybiz
      MINIO_ROOT_PASSWORD: supplybiz123
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
