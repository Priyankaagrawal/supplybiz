info:
  title: Supply Biz API
  description: ''
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CustomerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mobile:
          type: string
        email:
          type: string
          nullable: true
        address:
          type: string
        preferredPayment:
          type: string
          enum:
            - CASH
            - UPI
            - BANK
            - WALLET
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        linkStatus:
          type: string
          enum:
            - UNLINKED
            - LINKED
        userId:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - name
        - mobile
        - email
        - address
        - preferredPayment
        - status
        - linkStatus
        - userId
    CustomerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerResponse'
        total:
          type: integer
        activeCount:
          type: integer
        customerLimit:
          type: integer
      required:
        - items
        - total
        - activeCount
        - customerLimit
    CustomerInput:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
          description: Indian mobile, ten digits or +91-prefixed. Stored in +91 form.
        email:
          type: string
          nullable: true
        address:
          type: string
          description: Defaults to empty on creation; omission preserves the address on PATCH.
        preferredPayment:
          type: string
          enum:
            - CASH
            - UPI
            - BANK
            - WALLET
          description: Defaults to CASH on creation; omission preserves the method on PATCH.
      required:
        - name
        - mobile
    CustomerPatch:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
          description: Indian mobile, ten digits or +91-prefixed. Stored in +91 form.
        email:
          type: string
          nullable: true
        address:
          type: string
          description: Defaults to empty on creation; omission preserves the address on PATCH.
        preferredPayment:
          type: string
          enum:
            - CASH
            - UPI
            - BANK
            - WALLET
          description: Defaults to CASH on creation; omission preserves the method on PATCH.
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
    LinkRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The matching vendor-customer record ID.
        vendorId:
          type: string
          format: uuid
        businessName:
          type: string
          nullable: true
      required:
        - id
        - vendorId
        - businessName
    LinkRequestList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LinkRequestResponse'
        total:
          type: integer
      required:
        - items
        - total
    LinkDecisionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        decision:
          type: string
          enum:
            - ACCEPTED
            - DECLINED
      required:
        - id
        - decision
    InboxItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - VENDOR
            - CUSTOMER
        category:
          type: string
          enum:
            - ORDERS
            - PAYMENTS
            - DELIVERY
            - SYSTEM
        type:
          type: string
        title:
          type: string
        body:
          type: string
        path:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - category
        - type
        - title
        - body
        - path
        - readAt
        - createdAt
    InboxResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InboxItem'
        total:
          type: integer
        unreadCount:
          type: integer
      required:
        - items
        - total
        - unreadCount
    ReadNotifications:
      type: object
      properties:
        role:
          type: string
          enum:
            - VENDOR
            - CUSTOMER
        ids:
          description: Provide IDs or all=true, exclusively.
          type: array
          items:
            type: string
            format: uuid
        all:
          type: boolean
    NotificationMutationResponse:
      type: object
      properties:
        changed:
          type: integer
      required:
        - changed
    NotificationPreferences:
      type: object
      properties:
        orders:
          type: boolean
        payments:
          type: boolean
        delivery:
          type: boolean
        system:
          type: boolean
          description: Optional system pushes only; security/KYC always bypass this preference.
      required:
        - orders
        - payments
        - delivery
        - system
    DevicePushInput:
      type: object
      properties:
        pushToken:
          type: string
          nullable: true
          description: Required when enabled. Null/omission with pushEnabled=false removes the current token. Never echoed.
        pushEnabled:
          type: boolean
        appVersion:
          type: string
        osVersion:
          type: string
      required:
        - pushEnabled
    DevicePushResponse:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        pushEnabled:
          type: boolean
      required:
        - deviceId
        - pushEnabled
    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        productType:
          type: string
        milkType:
          type: string
          nullable: true
        unitValue:
          type: number
        unitType:
          type: string
          enum:
            - ML
            - L
            - G
            - KG
            - PCS
        sellingPricePaise:
          type: integer
        subscriptionPricePaise:
          type: integer
          nullable: true
        stockQty:
          type: integer
        moq:
          type: integer
        description:
          type: string
        imageMediaId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        version:
          type: integer
      required:
        - id
        - name
        - productType
        - milkType
        - unitValue
        - unitType
        - sellingPricePaise
        - subscriptionPricePaise
        - stockQty
        - moq
        - description
        - imageMediaId
        - isActive
        - version
    ProductList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        total:
          type: integer
      required:
        - items
        - total
    ProductOptions:
      type: object
      properties:
        productTypes:
          description: Admin-managed product type codes for the signed-in vendor category.
          type: array
          items:
            type: string
      required:
        - productTypes
    ProductInput:
      type: object
      properties:
        name:
          type: string
        productType:
          type: string
          description: One of the vendor category productTypes (admin-managed).
        milkType:
          type: string
          nullable: true
          enum:
            - COW
            - BUFFALO
            - TONED
            - DOUBLE_TONED
            - FULL_CREAM
            - OTHER
        unitValue:
          type: number
          minimum: 0.001
          maximum: 999999999.999
        unitType:
          type: string
          enum:
            - ML
            - L
            - G
            - KG
            - PCS
        sellingPricePaise:
          type: integer
          minimum: 1
          maximum: 2147483647
        subscriptionPricePaise:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
        stockQty:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
        moq:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
        description:
          type: string
          default: ''
        imageMediaId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
          default: true
      required:
        - name
        - productType
        - unitValue
        - unitType
        - sellingPricePaise
    ProductPatch:
      type: object
      properties:
        name:
          type: string
        productType:
          type: string
          description: One of the vendor category productTypes (admin-managed).
        milkType:
          type: string
          nullable: true
          enum:
            - COW
            - BUFFALO
            - TONED
            - DOUBLE_TONED
            - FULL_CREAM
            - OTHER
        unitValue:
          type: number
          minimum: 0.001
          maximum: 999999999.999
        unitType:
          type: string
          enum:
            - ML
            - L
            - G
            - KG
            - PCS
        sellingPricePaise:
          type: integer
          minimum: 1
          maximum: 2147483647
        subscriptionPricePaise:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
        stockQty:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
        moq:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
        description:
          type: string
          default: ''
        imageMediaId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
          default: true
        stockReason:
          type: string
          description: Required when changing stockQty.
    ProductDeleted:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deleted:
          type: boolean
      required:
        - id
        - deleted
    StockAdjustment:
      type: object
      properties:
        delta:
          type: integer
          description: Nonzero pack delta.
        reason:
          type: string
      required:
        - delta
        - reason
    CategoryRow:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        icon:
          type: string
          description: Icon identifier, not a URL or HTML. Empty clears the icon.
        type:
          type: string
          enum:
            - SUPPLY
            - BILL
        status:
          type: string
          enum:
            - ENABLED
            - COMING_SOON
