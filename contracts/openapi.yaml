info:
  title: Supply Biz API
  description: ''
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AdminDashboard:
      type: object
      properties:
        serverTime:
          type: string
          format: date-time
        vendorsTotal:
          type: integer
          minimum: 0
        vendorsSuspended:
          type: integer
          minimum: 0
        kycPending:
          type: integer
          minimum: 0
        kycVerified:
          type: integer
          minimum: 0
        customersTotal:
          type: integer
          minimum: 0
        customersBlocked:
          type: integer
          minimum: 0
        ordersTotal:
          type: integer
          minimum: 0
        ordersDelivered:
          type: integer
          minimum: 0
        ordersFailed:
          type: integer
          minimum: 0
        recordedGmvPaise:
          type: string
          pattern: ^[0-9]+$
          description: >-
            Delivered-order component of PRD GMV only; quick-sale value unavailable until T-079/T-080. All-time stored
            DELIVERED order totals, including delivery charges and discounts; not cash receipts. Decimal integer paise
            string preserves BigInt precision.
        gmvScope:
          type: string
          enum:
            - DELIVERED_ORDERS_ONLY
          description: Full platform GMV also requires quick-sale value, unavailable before T-079/T-080.
        planAssignmentsTotal:
          type: integer
          minimum: 0
          description: All historical audited assignment rows, including superseded grants; never revenue.
        planRevenueStatus:
          type: string
          enum:
            - UNAVAILABLE
          description: Automated plan billing is deferred; no inferred revenue.
      required:
        - serverTime
        - vendorsTotal
        - vendorsSuspended
        - kycPending
        - kycVerified
        - customersTotal
        - customersBlocked
        - ordersTotal
        - ordersDelivered
        - ordersFailed
        - recordedGmvPaise
        - gmvScope
        - planAssignmentsTotal
        - planRevenueStatus
    HomeCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - ENABLED
            - COMING_SOON
        available:
          type: boolean
        productTypes:
          type: array
          items:
            type: string
      required:
        - id
        - code
        - name
        - icon
        - status
        - available
        - productTypes
    HomeDeliveryItem:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
          description: Persisted order-time name, including inactive/deleted products.
        qty:
          type: integer
      required:
        - productId
        - name
        - qty
    HomeDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNo:
          type: string
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - APP
            - SUBSCRIPTION
            - VENDOR
        status:
          type: string
          enum:
            - NEW
            - ACCEPTED
            - REJECTED
            - PREPARING
            - OUT_FOR_DELIVERY
            - DELIVERED
