openapi: 3.0.0
paths:
  /api/v1/admin/dashboard:
    get:
      operationId: DashboardController_get
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
      tags:
        - admin-dashboard
      security:
        - bearer: []
  /api/v1/customer/home:
    get:
      operationId: HomeController_get
      parameters:
        - name: lat
          required: false
          in: query
          description: Optional location pair; does not filter owned deliveries.
          schema:
            minimum: -90
            maximum: 90
            type: number
        - name: lng
          required: false
          in: query
          schema:
            minimum: -180
            maximum: 180
            type: number
        - name: pincode
          required: false
          in: query
          schema:
            pattern: ^[1-9][0-9]{5}$
            type: string
        - name: limit
          required: false
          in: query
          schema:
            maximum: 50
            default: 20
            type: number
        - name: cursor
          required: false
          in: query
          description: Last order ID from this customer and current IST day.
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerHome'
        '400':
          description: Invalid query or cursor not owned by this customer/current IST day.
        '401':
          description: Missing, revoked or expired session.
        '403':
          description: CUSTOMER_ROLE_REQUIRED.
      tags:
        - customer-home
      security:
        - bearer: []
  /api/v1/customer/vendors:
