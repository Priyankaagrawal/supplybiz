openapi: 3.0.0
paths:
  /api/v1/admin/audit-logs:
    get:
      operationId: AuditController_list
      parameters:
        - name: beforeId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: action
          required: false
          in: query
          schema:
            type: string
        - name: actorId
          required: false
          in: query
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
      tags:
        - audit
      security:
        - bearer: []
  /api/v1/vendor/onboarding/categories:
    get:
      operationId: VendorsController_categories
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendorCategoryResponse'
        '401':
          description: Missing, expired or revoked session.
        '403':
          description: 'VENDOR_ROLE_REQUIRED: requires held and active vendor role.'
      tags:
        - vendor-onboarding
      security:
        - bearer: []
  /api/v1/vendor/onboarding:
    get:
      operationId: VendorsController_profile
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfileResponse'
        '401':
          description: Missing, expired or revoked session.
        '403':
          description: 'VENDOR_ROLE_REQUIRED: requires held and active vendor role.'
        '404':
          description: 'ONBOARDING_NOT_STARTED: show category screen.'
      tags:
        - vendor-onboarding
      security:
        - bearer: []
  /api/v1/vendor/onboarding/category:
    post:
      operationId: VendorsController_category
      parameters:
        - name: Idempotency-Key
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCategoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfileResponse'
        '400':
          description: Invalid category or key.
        '401':
          description: Missing, expired or revoked session.
        '403':
          description: 'VENDOR_ROLE_REQUIRED: requires held and active vendor role.'
        '409':
          description: REVERIFICATION_REQUIRED
        '422':
          description: IDEMPOTENCY_MISMATCH
      tags:
        - vendor-onboarding
      security:
        - bearer: []
  /api/v1/vendor/onboarding/business:
    put:
      operationId: VendorsController_business
      parameters:
        - name: Idempotency-Key
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorBusinessDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfileResponse'
        '400':
          description: Invalid business fields or key.
        '401':
          description: Missing, expired or revoked session.
        '403':
          description: 'VENDOR_ROLE_REQUIRED: requires held and active vendor role.'
        '404':
          description: 'MEDIA_NOT_FOUND: wrong owner/purpose or not READY.'
        '409':
          description: CATEGORY_REQUIRED or REVERIFICATION_REQUIRED
        '422':
          description: IDEMPOTENCY_MISMATCH
      tags:
        - vendor-onboarding
      security:
        - bearer: []
  /api/v1/media:
    post:
      operationId: MediaController_upload
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - purpose
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum:
                    - PRODUCT_IMAGE
                    - SHOP_PHOTO
                    - PROFILE
                    - KYC_DOC
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '400':
          description: Invalid media or multipart fields.
        '413':
          description: File exceeds configured limit.
        '422':
          description: IDEMPOTENCY_MISMATCH
      tags:
        - media
      security:
        - bearer: []
  /api/v1/media/{id}/content:
    get:
      operationId: MediaController_content
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
                format: binary
        '404':
          description: Missing media or not owned by caller.
      tags:
        - media
      security:
        - bearer: []
  /api/v1/admin/media/{id}/content:
    get:
      operationId: AdminMediaController_content
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
                format: binary
      tags:
        - media
      security:
        - bearer: []
  /api/v1/admin/auth/login:
    post:
      operationId: AdminAuthController_login
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChallengeResponse'
      tags:
        - admin-auth
  /api/v1/admin/auth/challenge:
    get:
      operationId: AdminAuthController_challenge
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnrollmentResponse'
      tags:
        - admin-auth
      security:
        - bearer: []
  /api/v1/admin/auth/totp/verify:
    post:
      operationId: AdminAuthController_verify
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
      tags:
        - admin-auth
  /api/v1/admin/auth/me:
    get:
      operationId: AdminAuthController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
      tags:
        - admin-auth
      security:
        - bearer: []
  /api/v1/admin/auth/logout:
    post:
      operationId: AdminAuthController_logout
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: ''
      tags:
        - admin-auth
      security:
        - bearer: []
  /api/v1/version:
    get:
      operationId: VersionController_getVersion
      summary: Get build metadata
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: api
                  version:
                    type: string
                    example: 0.1.0
                  nodeEnv:
                    type: string
                    example: development
                  buildTime:
                    type: string
                    nullable: true
                  gitSha:
                    type: string
                    nullable: true
                required:
                  - service
                  - version
                  - nodeEnv
      tags:
        - Version
  /api/v1/config:
    get:
      operationId: AppConfigController_read
      summary: Get public mobile minimum version and simple flags
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
      tags:
        - Configuration
  /api/v1/health/live:
    get:
      operationId: HealthController_getLive
      summary: Liveness probe
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time
                required:
                  - status
                  - timestamp
      tags:
        - Health
  /api/v1/health/ready:
    get:
      operationId: HealthController_getReady
      summary: Readiness probe
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Service dependencies unavailable
      tags:
        - Health
  /api/v1/auth/otp/send:
    post:
      operationId: OtpController_send
      summary: Send OTP (development simulation until Q-09 is resolved)
      parameters:
        - name: X-Device-Id
          in: header
          description: Stable installation identifier, 1–128 ASCII letters, digits, hyphens or underscores.
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOtpResponse'
        '400':
          description: Invalid request or missing device/idempotency header.
        '429':
          description: RATE_LIMITED; Retry-After header is seconds until retry.
        '503':
          description: OTP delivery disabled or unavailable.
      tags:
        - auth
  /api/v1/auth/otp/verify:
    post:
      operationId: SessionsController_verify
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        '400':
          description: VALIDATION_FAILED, including missing consent for first login.
        '422':
          description: OTP_INVALID or OTP_ATTEMPTS_EXCEEDED.
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: SessionsController_refresh
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        '401':
          description: UNAUTHENTICATED or REFRESH_REUSED (family revoked).
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      operationId: SessionsController_logout
      parameters:
        - name: all
          required: false
          in: query
          description: Defaults to false (current session family); true revokes all account sessions.
          schema:
            enum:
              - 'true'
              - 'false'
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked current family, or all sessions with ?all=true.
      tags:
        - auth
      security:
        - bearer: []
  /api/v1/auth/.well-known/jwks.json:
    get:
      operationId: SessionsController_jwks
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - auth
  /api/v1/me:
    get:
      operationId: MeController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: 'UNAUTHENTICATED: missing, invalid, expired or revoked session.'
      tags:
        - me
      security:
        - bearer: []
  /api/v1/me/roles:
    post:
      operationId: MeController_addRole
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: 'VALIDATION_FAILED: invalid role or missing Idempotency-Key.'
        '401':
          description: 'UNAUTHENTICATED: missing, invalid, expired or revoked session.'
      tags:
        - me
      security:
        - bearer: []
  /api/v1/me/active-role:
    put:
      operationId: MeController_activeRole
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: 'VALIDATION_FAILED: invalid role or missing Idempotency-Key.'
        '401':
          description: 'UNAUTHENTICATED: missing, invalid, expired or revoked session.'
        '403':
          description: ROLE_NOT_HELD.
      tags:
        - me
      security:
        - bearer: []
info:
  title: Supply Biz API
  description: ''
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AuditSnapshot:
      type: object
      properties:
        role:
          type: string
        status:
          type: string
        failed_attempts:
          type: number
        locked_until:
          type: string
          nullable: true
          format: date-time
        last_login_at:
          type: string
          nullable: true
          format: date-time
        totp_enrolled:
          type: boolean
      required:
        - role
        - status
        - failed_attempts
        - locked_until
        - last_login_at
        - totp_enrolled
    AuditRow:
      type: object
      properties:
        id:
          type: string
        actor_type:
          type: string
        actor_id:
          type: string
          nullable: true
        action:
          type: string
        entity:
          type: string
        entity_id:
          type: string
          nullable: true
        before:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuditSnapshot'
        after:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuditSnapshot'
        ip:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
      required:
        - id
        - actor_type
        - actor_id
        - action
        - entity
        - entity_id
        - before
        - after
        - ip
        - at
    AuditPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRow'
        hasMore:
          type: boolean
      required:
        - items
        - hasMore
    VendorCategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
      required:
        - id
        - code
        - name
        - icon
    VendorSettingsResponse:
      type: object
      properties:
        serviceRadiusKm:
          type: integer
          nullable: true
        deliveryChargePaise:
          type: integer
        minOrderPaise:
          type: integer
        timeSlots:
          type: array
          items:
            type: string
        autoAcceptSubscriptions:
          type: boolean
        acceptingToday:
          type: boolean
        deliveryPaused:
          type: boolean
        allowKhataOrders:
          type: boolean
        version:
          type: integer
      required:
        - serviceRadiusKm
        - deliveryChargePaise
        - minOrderPaise
        - timeSlots
        - autoAcceptSubscriptions
        - acceptingToday
        - deliveryPaused
        - allowKhataOrders
        - version
    VendorProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        onboardingStep:
          type: integer
          description: 'Next onboarding screen: 2 business, 3 KYC, 4 status. Never regresses.'
        kycStatus:
          type: string
        businessName:
          type: string
          nullable: true
        gstin:
          type: string
          nullable: true
        addressLine:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        shopPhotoMediaId:
          type: string
          format: uuid
          nullable: true
        settings:
          $ref: '#/components/schemas/VendorSettingsResponse'
      required:
        - id
        - categoryId
        - onboardingStep
        - kycStatus
        - businessName
        - gstin
        - addressLine
        - city
        - state
        - pincode
        - latitude
        - longitude
        - shopPhotoMediaId
        - settings
    VendorCategoryDto:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
      required:
        - categoryId
    VendorBusinessDto:
      type: object
      properties:
        businessName:
          type: string
        gstin:
          type: string
          nullable: true
        addressLine:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
          pattern: ^[1-9]\d{5}$
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        shopPhotoMediaId:
          type: string
          format: uuid
          nullable: true
      required:
        - businessName
        - addressLine
        - city
        - state
        - pincode
        - latitude
        - longitude
    MediaResponse:
      type: object
      properties:
        mediaId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - READY
      required:
        - mediaId
        - status
    LoginDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - email
        - password
    AdminChallengeResponse:
      type: object
      properties:
        challengeToken:
          type: string
      required:
        - challengeToken
    AdminEnrollmentResponse:
      type: object
      properties:
        enrollmentSecret:
          type: string
          nullable: true
      required:
        - enrollmentSecret
    TotpDto:
      type: object
      properties:
        challengeToken:
          type: string
        code:
          type: string
      required:
        - challengeToken
        - code
    AdminSessionResponse:
      type: object
      properties:
        sessionToken:
          type: string
        csrfToken:
          type: string
      required:
        - sessionToken
        - csrfToken
    AdminMeResponse:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
        - id
        - role
        - permissions
    AppConfigResponse:
      type: object
      properties:
        minVersionAndroid:
          type: string
          example: 0.1.0
          pattern: ^(0|[1-9]\d{0,5})\.(0|[1-9]\d{0,5})\.(0|[1-9]\d{0,5})$
        flags:
          type: object
          additionalProperties:
            type: boolean
      required:
        - minVersionAndroid
        - flags
    SendOtpDto:
      type: object
      properties:
        mobile:
          type: string
          pattern: ^(?:\+91)?[6-9]\d{9}$
        channel:
          type: string
          enum:
            - SMS
            - WHATSAPP
          description: Defaults to SMS.
        appHash:
          type: string
          pattern: ^[A-Za-z0-9+/]{11}$
      required:
        - mobile
    SendOtpResponse:
      type: object
      properties:
        resendAfterSec:
          type: integer
          minimum: 30
          maximum: 30
          example: 30
        expiresInSec:
          type: integer
          minimum: 300
          maximum: 300
          example: 300
      required:
        - resendAfterSec
        - expiresInSec
    DeviceDto:
      type: object
      properties:
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
            - WEB
        appVersion:
          type: string
        osVersion:
          type: string
      required:
        - platform
    ConsentDto:
      type: object
      properties:
        termsVersion:
          type: string
        privacyVersion:
          type: string
      required:
        - termsVersion
        - privacyVersion
    VerifyOtpDto:
      type: object
      properties:
        mobile:
          type: string
          pattern: ^(?:\+91)?[6-9]\d{9}$
        code:
          type: string
          pattern: ^\d{6}$
        device:
          $ref: '#/components/schemas/DeviceDto'
        consent:
          $ref: '#/components/schemas/ConsentDto'
      required:
        - mobile
        - code
        - device
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mobile:
          type: string
        name:
          type: string
          nullable: true
        language:
          type: string
          enum:
            - EN
            - HI
        roles:
          type: array
          items:
            type: string
            enum:
              - CUSTOMER
              - VENDOR
        activeRole:
          type: string
          enum:
            - CUSTOMER
            - VENDOR
          nullable: true
      required:
        - id
        - mobile
        - name
        - language
        - roles
        - activeRole
    TokensResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSec:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/MeResponse'
      required:
        - accessToken
        - refreshToken
        - expiresInSec
        - user
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - refreshToken
    RoleDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - CUSTOMER
            - VENDOR
      required:
        - role
