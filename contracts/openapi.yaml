openapi: 3.0.0
paths:
  /api/v1/vendor/customers:
    get:
      operationId: CustomersController_list
      parameters:
        - name: search
          required: false
          in: query
          schema:
            type: string
        - name: filter
          required: false
          in: query
          schema:
            default: ALL
            enum:
              - ALL
              - ACTIVE
              - INACTIVE
              - SUBSCRIPTION
            type: string
        - name: limit
          required: false
          in: query
          schema:
            maximum: 100
            default: 50
            type: integer
        - name: offset
          required: false
          in: query
          schema:
            default: 0
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '400':
          description: Invalid input or missing Idempotency-Key.
        '401':
          description: Missing, expired or revoked session.
        '403':
          description: VENDOR_ROLE_REQUIRED or VENDOR_SUSPENDED.
        '404':
          description: CUSTOMER_NOT_FOUND, including other vendors.
        '409':
          description: DUPLICATE, LINKED_MOBILE_IMMUTABLE or CATEGORY_REQUIRED.
        '422':
          description: PLAN_CUSTOMER_LIMIT or IDEMPOTENCY_MISMATCH.
      tags:
        - vendor-customers
      security:
        - bearer: []
    post:
      operationId: CustomersController_create
      parameters:
        - name: Idempotency-Key
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid input or missing Idempotency-Key.
        '401':
          description: Missing, expired or revoked session.
        '403':
          description: VENDOR_ROLE_REQUIRED or VENDOR_SUSPENDED.
        '404':
          description: CUSTOMER_NOT_FOUND, including other vendors.
        '409':
          description: DUPLICATE, LINKED_MOBILE_IMMUTABLE or CATEGORY_REQUIRED.
        '422':
          description: PLAN_CUSTOMER_LIMIT or IDEMPOTENCY_MISMATCH.
      tags:
        - vendor-customers
      security:
        - bearer: []
